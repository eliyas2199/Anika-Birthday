<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080812">
  <title>A Little World for Anika</title>
  <!-- Calligraphy fonts for Phase 2 (script falls back to system cursive fonts if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet">
  <!-- Fonts for Stage 4 (Bengali letter + the ending). Falls back to system fonts if offline. -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./phase3.css">
  <link rel="stylesheet" href="./phase4.css">
  <link rel="stylesheet" href="./stage-link.css">
</head>
<body>
  <!-- Intro: the moon is the one tap that unlocks audio for the whole experience -->
  <section class="intro" id="intro">
    <div class="stars" id="stars" aria-hidden="true"></div>

    <button class="moon-btn" id="moon" type="button" aria-label="Click the moon to begin">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="moonGrad" cx=".36" cy=".32" r=".85">
            <stop offset="0" stop-color="#FFFCF2"/>
            <stop offset=".55" stop-color="#F6EBCB"/>
            <stop offset="1" stop-color="#D3BE8A"/>
          </radialGradient>
          <radialGradient id="moonShade" cx=".5" cy=".5" r=".5">
            <stop offset=".72" stop-color="#6E5A2E" stop-opacity="0"/>
            <stop offset="1" stop-color="#6E5A2E" stop-opacity=".28"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="92" fill="url(#moonGrad)"/>
        <g fill="#B9A267" fill-opacity=".30">
          <circle cx="68" cy="72" r="17"/>
          <circle cx="126" cy="64" r="9"/>
          <circle cx="132" cy="116" r="21"/>
          <circle cx="82" cy="132" r="11"/>
          <circle cx="104" cy="94" r="6"/>
          <circle cx="58" cy="108" r="6"/>
        </g>
        <g fill="#FFFFFF" fill-opacity=".35">
          <circle cx="63" cy="68" r="8"/>
          <circle cx="126" cy="110" r="9"/>
        </g>
        <circle cx="100" cy="100" r="92" fill="url(#moonShade)"/>
      </svg>
    </button>

    <p class="intro-text">
      <span>Hey moon, you look like a moon.</span>
      <span>Please click the moon.</span>
    </p>
  </section>

  <main class="stage" id="stage">
    <svg id="cake" viewBox="0 0 700 740" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="An ornate birthday cake with an analog clock face">
      <defs>
        <!-- Plate -->
        <linearGradient id="plateGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F6DFA6"/>
          <stop offset=".35" stop-color="#C99A4E"/>
          <stop offset=".62" stop-color="#8E5F28"/>
          <stop offset="1" stop-color="#E8C987"/>
        </linearGradient>
        <radialGradient id="plateInner" cx=".5" cy=".42" r=".65">
          <stop offset="0" stop-color="#2B1D35"/>
          <stop offset="1" stop-color="#120E1C"/>
        </radialGradient>

        <!-- Cake side + ribbon -->
        <linearGradient id="sideGrad" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="610" y2="0">
          <stop offset="0" stop-color="#C79BB3"/>
          <stop offset=".25" stop-color="#E9C3D2"/>
          <stop offset=".5" stop-color="#F3D9DE"/>
          <stop offset=".75" stop-color="#E2B5C8"/>
          <stop offset="1" stop-color="#B58AA3"/>
        </linearGradient>
        <linearGradient id="sideShade" gradientUnits="userSpaceOnUse" x1="0" y1="320" x2="0" y2="640">
          <stop offset="0" stop-color="#3A1030" stop-opacity="0"/>
          <stop offset=".6" stop-color="#3A1030" stop-opacity=".12"/>
          <stop offset="1" stop-color="#3A1030" stop-opacity=".42"/>
        </linearGradient>
        <linearGradient id="ribbonGrad" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="610" y2="0">
          <stop offset="0" stop-color="#3E1538"/>
          <stop offset=".3" stop-color="#7A3C6B"/>
          <stop offset=".5" stop-color="#5E2754"/>
          <stop offset=".7" stop-color="#7A3C6B"/>
          <stop offset="1" stop-color="#3A1334"/>
        </linearGradient>
        <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8F4A7E"/>
          <stop offset=".55" stop-color="#5A2350"/>
          <stop offset="1" stop-color="#3A1436"/>
        </linearGradient>
        <clipPath id="sideClip">
          <rect x="90" y="320" width="520" height="60"/>
          <circle cx="350" cy="380" r="260"/>
        </clipPath>

        <!-- Cake top + clock face -->
        <radialGradient id="topGrad" cx=".4" cy=".32" r=".85">
          <stop offset="0" stop-color="#FFF6F0"/>
          <stop offset=".5" stop-color="#F5E5DE"/>
          <stop offset="1" stop-color="#E8C9CF"/>
        </radialGradient>
        <radialGradient id="faceGrad" cx=".42" cy=".35" r=".85">
          <stop offset="0" stop-color="#FFFAF5"/>
          <stop offset=".55" stop-color="#FBEFE8"/>
          <stop offset="1" stop-color="#EFD7D2"/>
        </radialGradient>
        <radialGradient id="faceShade" cx=".5" cy=".5" r=".5">
          <stop offset=".8" stop-color="#6E3C50" stop-opacity="0"/>
          <stop offset="1" stop-color="#6E3C50" stop-opacity=".22"/>
        </radialGradient>
        <radialGradient id="topLight" cx=".3" cy=".22" r=".75">
          <stop offset="0" stop-color="#FFF0D7" stop-opacity=".42"/>
          <stop offset="1" stop-color="#FFF0D7" stop-opacity="0"/>
        </radialGradient>

        <!-- Piping -->
        <radialGradient id="pipePink" cx=".45" cy=".4" r=".7">
          <stop offset="0" stop-color="#F7CEDB"/>
          <stop offset=".6" stop-color="#E9B9CB"/>
          <stop offset="1" stop-color="#CF93AE"/>
        </radialGradient>
        <radialGradient id="pipeLav" cx=".45" cy=".4" r=".7">
          <stop offset="0" stop-color="#DCC7EC"/>
          <stop offset=".6" stop-color="#B99ACF"/>
          <stop offset="1" stop-color="#9573B2"/>
        </radialGradient>

        <!-- Flowers -->
        <radialGradient id="rosePlum" cx=".4" cy=".35" r=".75">
          <stop offset="0" stop-color="#9A4B8A"/>
          <stop offset=".55" stop-color="#6B2D5E"/>
          <stop offset="1" stop-color="#3E1738"/>
        </radialGradient>
        <radialGradient id="roseIvory" cx=".4" cy=".35" r=".75">
          <stop offset="0" stop-color="#FFFBF1"/>
          <stop offset=".55" stop-color="#F5E5DE"/>
          <stop offset="1" stop-color="#D9BFB4"/>
        </radialGradient>
        <radialGradient id="blossomPink" cx=".5" cy=".5" r=".6">
          <stop offset="0" stop-color="#FFE9F1"/>
          <stop offset=".6" stop-color="#F1B8CD"/>
          <stop offset="1" stop-color="#D98EAE"/>
        </radialGradient>
        <radialGradient id="blossomLav" cx=".5" cy=".5" r=".6">
          <stop offset="0" stop-color="#EBDDF5"/>
          <stop offset=".6" stop-color="#C9AEE0"/>
          <stop offset="1" stop-color="#A586C4"/>
        </radialGradient>
        <linearGradient id="leafGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F3DB9C"/>
          <stop offset=".5" stop-color="#C99A4E"/>
          <stop offset="1" stop-color="#8A5A25"/>
        </linearGradient>
        <radialGradient id="pearl" cx=".35" cy=".3" r=".75">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset=".5" stop-color="#F5E5DE"/>
          <stop offset="1" stop-color="#C9A79C"/>
        </radialGradient>

        <!-- Hands + pivot -->
        <linearGradient id="handGold" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8E5F28"/>
          <stop offset=".45" stop-color="#F3DB9C"/>
          <stop offset=".6" stop-color="#E8C987"/>
          <stop offset="1" stop-color="#A87532"/>
        </linearGradient>
        <radialGradient id="pivotGrad" cx=".35" cy=".3" r=".8">
          <stop offset="0" stop-color="#FFF1C2"/>
          <stop offset=".4" stop-color="#E8C987"/>
          <stop offset=".8" stop-color="#A87532"/>
          <stop offset="1" stop-color="#6E4519"/>
        </radialGradient>

        <!-- Filters -->
        <filter id="topShadow" x="-10%" y="-10%" width="120%" height="125%">
          <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".4"/>
        </filter>
        <filter id="handShadow" filterUnits="userSpaceOnUse" x="150" y="100" width="400" height="400">
          <feDropShadow dx="1.5" dy="3" stdDeviation="2.2" flood-color="#3A1A10" flood-opacity=".45"/>
        </filter>
        <filter id="softBlur" x="-20%" y="-60%" width="140%" height="220%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>

        <!-- Bow (left half, mirrored for the right half) -->
        <g id="bowHalf">
          <path d="M347 614 L318 672 L336 666 L342 684 L354 622 Z"
                fill="url(#bowGrad)" stroke="#C99A4E" stroke-width=".8" stroke-linejoin="round"/>
          <path d="M350 609 C318 580 262 580 258 606 C256 636 316 640 350 609 Z"
                fill="url(#bowGrad)" stroke="#C99A4E" stroke-width=".9" stroke-linejoin="round"/>
          <path d="M346 609 C322 602 292 603 272 609" fill="none"
                stroke="#1F0A1D" stroke-opacity=".4" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M340 600 C318 588 282 588 268 598" fill="none"
                stroke="#E9B9CB" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>
        </g>
      </defs>

      <!-- Plate + shadow -->
      <g id="plate">
        <circle cx="350" cy="380" r="322" fill="#6B4520"/>
        <circle cx="350" cy="372" r="322" fill="url(#plateGold)"/>
        <circle cx="350" cy="372" r="311" fill="url(#plateInner)"/>
        <circle cx="350" cy="372" r="311" fill="none" stroke="#E8C987" stroke-opacity=".55" stroke-width=".8"/>
      </g>
      <ellipse cx="350" cy="642" rx="282" ry="26" fill="#000" fill-opacity=".55" filter="url(#softBlur)"/>

      <!-- Cake side -->
      <g id="cake-side">
        <rect x="90" y="320" width="520" height="60" fill="url(#sideGrad)"/>
        <circle cx="350" cy="380" r="260" fill="url(#sideGrad)"/>
        <g clip-path="url(#sideClip)">
          <circle cx="350" cy="362" r="260" fill="url(#ribbonGrad)"/>
          <rect x="90" y="336" width="520" height="26" fill="url(#ribbonGrad)"/>
          <circle cx="350" cy="336" r="260" fill="url(#sideGrad)"/>
          <rect x="90" y="320" width="520" height="60" fill="url(#sideShade)"/>
          <circle cx="350" cy="380" r="260" fill="url(#sideShade)"/>
        </g>
        <path d="M610 336 A260 260 0 0 1 90 336 M610 362 A260 260 0 0 1 90 362"
              fill="none" stroke="#D9B15F" stroke-width="1" stroke-opacity=".9"/>
        <g id="side-deco"></g>
      </g>

      <!-- Cake top -->
      <g id="cake-top" filter="url(#topShadow)">
        <circle cx="350" cy="320" r="260" fill="url(#topGrad)"/>
        <circle cx="350" cy="320" r="259" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1"/>
        <circle cx="350" cy="320" r="222" fill="none" stroke="#B87A94" stroke-opacity=".18" stroke-width="14"/>
        <g id="piping"></g>

        <g id="face">
          <circle cx="350" cy="320" r="210" fill="none" stroke="#6E3C50" stroke-opacity=".25" stroke-width="4"/>
          <circle cx="350" cy="320" r="206" fill="url(#faceGrad)" stroke="#C99A4E" stroke-width="2"/>
          <circle cx="350" cy="320" r="199" fill="none" stroke="#D9B15F" stroke-width=".7" stroke-opacity=".9"/>
          <circle cx="350" cy="320" r="206" fill="url(#faceShade)"/>
          <g id="marks"></g>
          <g id="numerals"></g>
          <text id="name" class="cake-name" x="350" y="418" text-anchor="middle">Anika</text>
        </g>

        <g id="ornaments"></g>
        <g id="leaves"></g>
        <g id="flowers"></g>
        <g id="pearls"></g>
        <circle cx="350" cy="320" r="260" fill="url(#topLight)" pointer-events="none"/>
      </g>

      <!-- Bow -->
      <g id="bow">
        <use href="#bowHalf"/>
        <use href="#bowHalf" transform="translate(700 0) scale(-1 1)"/>
        <ellipse cx="350" cy="611" rx="15" ry="13" fill="url(#bowGrad)" stroke="#C99A4E" stroke-width=".9"/>
        <circle cx="350" cy="611" r="6" fill="url(#pearl)" stroke="#A87532" stroke-width=".5"/>
        <circle cx="341" cy="606" r="3.2" fill="url(#pearl)" stroke="#A87532" stroke-width=".4"/>
        <circle cx="359" cy="606" r="3.2" fill="url(#pearl)" stroke="#A87532" stroke-width=".4"/>
        <circle cx="341" cy="617" r="3.2" fill="url(#pearl)" stroke="#A87532" stroke-width=".4"/>
        <circle cx="359" cy="617" r="3.2" fill="url(#pearl)" stroke="#A87532" stroke-width=".4"/>
      </g>

      <!-- Clock hands: shared pivot (350, 320) -->
      <g id="hands" filter="url(#handShadow)">
        <g id="hourHand" transform="rotate(0 350 320)">
          <path d="M350 226 L361 262 L356 290 L357 322 L350 342 L343 322 L344 290 L339 262 Z"
                fill="url(#handGold)" stroke="#6B4318" stroke-width="1" stroke-linejoin="round"/>
          <path d="M350 236 L350 318" stroke="#FFF1C2" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/>
        </g>
        <g id="minuteHand" transform="rotate(0 350 320)">
          <path d="M350 186 L355 214 L352.5 240 L353.5 322 L350 346 L346.5 322 L347.5 240 L345 214 Z"
                fill="url(#handGold)" stroke="#6B4318" stroke-width="1" stroke-linejoin="round"/>
          <path d="M350 196 L350 318" stroke="#FFF1C2" stroke-opacity=".55" stroke-width=".9" stroke-linecap="round"/>
        </g>
        <circle id="pivot" cx="350" cy="320" r="11" fill="url(#pivotGrad)" stroke="#6B4318" stroke-width="1"/>
        <circle cx="350" cy="320" r="3.6" fill="#6E4519"/>
        <circle cx="348" cy="318" r="1.4" fill="#FFF1C2" fill-opacity=".8"/>
      </g>
    </svg>
  </main>


  <!-- ================= PHASE 2 (hidden until Phase 1 ends) ================= -->
  <main class="p2-root" id="p2-root" data-embedded>
    <div class="p2-sky" aria-hidden="true"></div>
    <div class="p2-stars" id="p2-stars" aria-hidden="true"></div>
    <div class="p2-clouds" aria-hidden="true">
      <i class="p2-cloud p2-cloud--a"></i>
      <i class="p2-cloud p2-cloud--b"></i>
      <i class="p2-cloud p2-cloud--c"></i>
    </div>

    <!-- The moon: rises first, stays forever, becomes the "next stage" switch at the very end -->
    <button class="p2-moon" id="p2-moon" type="button" disabled tabindex="-1" aria-label="The moon">
      <span class="p2-moon-halo" aria-hidden="true"></span>
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="p2MoonGrad" cx=".36" cy=".32" r=".85">
            <stop offset="0" stop-color="#FFFCF2"/>
            <stop offset=".55" stop-color="#F6EBCB"/>
            <stop offset="1" stop-color="#D3BE8A"/>
          </radialGradient>
          <radialGradient id="p2MoonShade" cx=".5" cy=".5" r=".5">
            <stop offset=".72" stop-color="#6E5A2E" stop-opacity="0"/>
            <stop offset="1" stop-color="#6E5A2E" stop-opacity=".28"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="92" fill="url(#p2MoonGrad)"/>
        <g fill="#B9A267" fill-opacity=".30">
          <circle cx="68" cy="72" r="17"/>
          <circle cx="126" cy="64" r="9"/>
          <circle cx="132" cy="116" r="21"/>
          <circle cx="82" cy="132" r="11"/>
          <circle cx="104" cy="94" r="6"/>
          <circle cx="58" cy="108" r="6"/>
        </g>
        <g fill="#FFFFFF" fill-opacity=".35">
          <circle cx="63" cy="68" r="8"/>
          <circle cx="126" cy="110" r="9"/>
        </g>
        <circle cx="100" cy="100" r="92" fill="url(#p2MoonShade)"/>
      </svg>
    </button>

    <!-- Fireworks, rocket and the particle lettering are drawn here -->
    <canvas class="p2-canvas" id="p2-canvas" aria-hidden="true"></canvas>

    <h1 class="p2-sr">Happy Birthday Anika</h1>
  </main>


  <!-- STAGE 3: birthday wish + portrait (re-uses the moon of Stage 2) -->
  <main class="p3-root" id="p3-root" data-embedded>

    <!-- Stage 3 re-uses the moon of Stage 2 (adopted in JS); this one is removed when Stage 3 starts -->
    <button class="p3-moon" id="p3-moon" type="button" tabindex="-1" aria-hidden="true" style="display:none">
      <span class="p3-moon-halo" aria-hidden="true"></span>
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="p3MoonGrad" cx=".36" cy=".32" r=".85">
            <stop offset="0" stop-color="#FFFCF2"/>
            <stop offset=".55" stop-color="#F6EBCB"/>
            <stop offset="1" stop-color="#D3BE8A"/>
          </radialGradient>
          <radialGradient id="p3MoonShade" cx=".5" cy=".5" r=".5">
            <stop offset=".72" stop-color="#6E5A2E" stop-opacity="0"/>
            <stop offset="1" stop-color="#6E5A2E" stop-opacity=".28"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="92" fill="url(#p3MoonGrad)"/>
        <g fill="#B9A267" fill-opacity=".30">
          <circle cx="68" cy="72" r="17"/>
          <circle cx="126" cy="64" r="9"/>
          <circle cx="132" cy="116" r="21"/>
          <circle cx="82" cy="132" r="11"/>
          <circle cx="104" cy="94" r="6"/>
          <circle cx="58" cy="108" r="6"/>
        </g>
        <g fill="#FFFFFF" fill-opacity=".35">
          <circle cx="63" cy="68" r="8"/>
          <circle cx="126" cy="110" r="9"/>
        </g>
        <circle cx="100" cy="100" r="92" fill="url(#p3MoonShade)"/>
      </svg>
    </button>

    <!-- Message and portrait share the same area below the moon -->
    <section class="p3-stage" id="p3-stage">
      <h1 class="p3-message" id="p3-message">Happy Birthday, Anika!</h1>

      <figure class="p3-portrait" id="p3-portrait">
        <!-- The image path is set in phase3.js (CONFIG.PORTRAIT_SRC) -->
        <img id="p3-img" alt="Anika" decoding="async" draggable="false">
        <div class="p3-fallback" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2z" fill="currentColor"/>
          </svg>
        </div>
      </figure>
    </section>
  </main>

  <!-- STAGE 4: the royal gift box (re-uses the same moon and sky) -->
  <main class="p4-root" id="p4-root" data-embedded>

    <!-- Sky: identical look to Phase 2 / Phase 3 -->
    <div class="p4-sky" aria-hidden="true"></div>
    <div class="p4-stars" id="p4-stars" aria-hidden="true"></div>
    <div class="p4-clouds" aria-hidden="true">
      <i class="p4-cloud p4-cloud--a"></i>
      <i class="p4-cloud p4-cloud--b"></i>
      <i class="p4-cloud p4-cloud--c"></i>
    </div>
    <div class="p4-ground" aria-hidden="true"></div>

    <!-- The scene and the gift box are drawn with SVG by phase4.js (no photograph).
         Back layer -> gifts -> front layer: gifts come out from BEHIND the front wall of the open box. -->
    <div class="p4-sc p4-scene" id="p4-scene" aria-hidden="true">
      <div class="p4-bg"><svg id="p4-bgsvg" class="p4-sc-svg" viewBox="0 0 940 1192"></svg></div>
      <i class="p4-flame p4-flame--a"></i>
      <i class="p4-flame p4-flame--b"></i>
      <svg id="p4-backsvg" class="p4-sc-svg" viewBox="0 0 940 1192"></svg>
      <div class="p4-spots" id="p4-spots" aria-hidden="true"></div>
      <div class="p4-seam" id="p4-seam">
        <i class="p4-seam-beam"></i>
        <i class="p4-seam-glow"></i>
      </div>
    </div>
    <div class="p4-sc p4-scene-front" id="p4-scene-front" aria-hidden="true">
      <svg id="p4-frontsvg" class="p4-sc-svg" viewBox="0 0 940 1192"></svg>
    </div>

    <!-- Everything that rises out of the box lives in this layer -->
    <div class="p4-gifts" id="p4-gifts">

      <!-- ITEM 1: royal scroll -->
      <div class="p4-letter" id="p4-letter" aria-hidden="true">
        <div class="p4-scroll">
          <div class="p4-sheet" id="p4-sheet">
            <div class="p4-reader" id="p4-reader">
              <div class="p4-text" id="p4-text" lang="bn"></div>
            </div>
          </div>
          <div class="p4-roller p4-roller--top"></div>
          <div class="p4-roller p4-roller--bottom" id="p4-roller-b"></div>
        </div>
      </div>

      <!-- ITEM 2: Anika's portrait (assets/anika-portrait-1.jpg) -->
      <figure class="p4-gift p4-gift--portrait" id="p4-portrait">
        <div class="p4-gift-float">
          <img id="p4-portrait-img" alt="Anika" decoding="async" draggable="false">
          <div class="p4-ph" aria-hidden="true"></div>
        </div>
      </figure>

      <!-- ITEM 3: black hijab, drawn with SVG (no image file needed) -->
      <div class="p4-gift p4-gift--hijab" id="p4-hijab" aria-hidden="true">
        <div class="p4-gift-float">
          <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <defs>
